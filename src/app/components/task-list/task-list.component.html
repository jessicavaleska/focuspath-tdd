<p>task-list works!</p>

<ul>
  <li *ngFor="let task of tasks">
    <span>{{ task.title }}</span>

    <input
      type="checkbox"
      [checked]="task.completed"
      (change)="toggleTask(task.id)"
    />

    <button type="button" (click)="deleteTask(task.id)">
      Excluir
    </button>
  </li>
</ul>
